name: FieldOrder CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    name: Flutter Lint, Analyze & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: fieldorder_mobile

      - name: Verify Code Formatting
        run: dart format --set-exit-if-changed .
        working-directory: fieldorder_mobile

      - name: Run Static Analysis (Linter)
        run: flutter analyze
        working-directory: fieldorder_mobile

      - name: Run Automated Tests with Coverage
        run: flutter test --coverage
        working-directory: fieldorder_mobile

  backend_tests:
    name: FastAPI Delta Sync & Idempotency Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: pip install fastapi uvicorn pydantic

      - name: Seed Database
        run: python3 backend/seed_data.py

      - name: Run Backend Daemon
        run: |
          python3 -m uvicorn backend.server:app --port 8000 &
          sleep 3

      - name: Execute 27 Integration Tests
        run: python3 backend/test_suite.py

  build_release_apk:
    name: Build Signed Release APK
    needs: [analyze_and_test, backend_tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Release APK
        run: flutter build apk --release
        working-directory: fieldorder_mobile

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: fieldorder_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
